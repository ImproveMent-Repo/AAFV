# Experiment 0 configuration. Items marked VERIFY must be checked on the compute machine before the pre-registration commit.
seed: 20261113
out_dir: runs/exp0                      # every output goes below this directory (relative to the current working directory)

datasets:                               # fill `root`; set use: false to skip a dataset
  agedb: {kind: agedb, root: "", use: true}         # folder of AgeDB images named <id>_<Name>_<age>_<m|f>.jpg
  fgnet: {kind: fgnet, root: "", use: true, sex_overrides: ""}   # FG-NET has no sex labels: CSV person,sex (M/F) for the 82
                                                                 # persons, annotated before generation (needed by FADING)
  # extra: {kind: csv, csv: "", use: false}         # generic CSV with columns path, person_id, age[, sex]

align:
  dlib_predictor: ""                    # path to shape_predictor_68_face_landmarks.dat
  size: 256

pairs:
  n_folds: 5
  gap_edges: [0, 5, 15, 30]             # bins 0-4, 5-14, 15-29, 30+
  adult_min_age: 16
  max_genuine_per_person_per_bin: 20
  impostors_per_genuine: 10
  impostor_age_tol: 2
  impostor_age_tol_max: 4

generators:
  sam:
    backend: sam
    decision: true
    sam_dir: ""                         # clone of github.com/yuval-alaluf/SAM
    checkpoint: pretrained_models/sam_ffhq_aging.pt     # relative to sam_dir
    batch_size: 16
    age_range: [0, 100]
  fading:
    backend: command
    decision: true
    age_range: [0, 100]                 # VERIFY: neither the README nor age_editing.py states a range; check the BMVC 2023 paper
    fading_dir: ""                      # clone of github.com/MunchkinChen/FADING (branch master), patched with Code/AAFV_Net/scripts/patch_fading.py
    specialized_path: ""                # diffusers-format directory loaded by StableDiffusionPipeline.from_pretrained (README Google-Drive download)
    requires_binary_gender: true        # age_editing.py: --gender choices ["female", "male"]; unknown-sex images are skipped, never guessed
    # Interface checked 2026-11-13 against age_editing.py (master). Placeholders: {fading_dir} {specialized_path} {src} {img_id}
    # {age_init} {gender_word} {tmp_out}; the token "{targets}" expands to one argument per target age (nargs='+', type=int).
    # FADING centre-crops and resizes the input to 512x512 itself; our 256 FFHQ crop is centred, and outputs are resized back to 256.
    command: ["python", "{fading_dir}/age_editing.py", "--image_path", "{src}", "--age_init", "{age_init}",
              "--gender", "{gender_word}", "--save_aged_dir", "{tmp_out}", "--specialized_path", "{specialized_path}",
              "--target_ages", "{targets}"]
    output_pattern: "{tmp_out}/{img_id}_{t}.png"   # from code: os.path.join(save_aged_dir, f'{input_img_name}_{age_new}.png')
  identity:
    backend: identity                   # returns the input unchanged; pipeline test only, never part of the decision
    decision: false
    age_range: [0, 120]

recognizers:
  arcface: {backend: insightface, model: buffalo_l, independent: false}
  # AdaFace: build_model('ir_101') is the README's "R100" row (choose WebFace4M or WebFace12M; record which). Loader and BGR
  # (x/255-0.5)/0.5 preprocessing checked against inference.py (master), 2026-11-13. Forward returns (unit feature, norm).
  adaface: {backend: adaface, repo: "", checkpoint: "", arch: ir_101, independent: true}
  # MagFace: builder_inf(args) reads arch, embedding_size, resume, cpu_mode; input BGR in [0,1] (ToTensor, mean 0 / std 1);
  # forward returns the raw (unnormalised) embedding. Checked against inference/network_inf.py and gen_feat.py (main), 2026-11-13.
  magface: {backend: magface, repo: "", checkpoint: "", arch: iresnet100, independent: true}

analysis:
  fmr_primary: 1.0e-3
  fmr_fallback: 1.0e-2
  min_impostor_weight_for_primary: 3000
  bootstrap: 1000
  alpha: 0.05
  n_decision_tests: 8
  decision_bins: ["15-29", "30+"]
  preflight_min_auc: 0.95
